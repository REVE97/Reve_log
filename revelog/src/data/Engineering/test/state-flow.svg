<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="560"
  viewBox="0 0 1000 560"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">비동기 요청의 화면 상태</title>
  <desc id="desc">요청 전 idle에서 loading을 거쳐 success 또는 error로 전환되는 상태도</desc>
  <defs>
    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0v32"
        fill="none"
        stroke="#d8dce1"
        stroke-opacity=".55"
      />
    </pattern>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
    >
      <path
        d="m0 0 8 4-8 4"
        fill="#758499"
      />
    </marker>
  </defs>
  <rect
    width="1000"
    height="560"
    rx="16"
    fill="#eef0f3"
  />
  <rect
    width="1000"
    height="560"
    rx="16"
    fill="url(#grid)"
  />
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text
