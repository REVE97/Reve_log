      <path d="M265 316h78" />
      <path d="M558 316h60v-76h69" />
      <path d="M618 316v76h69" />
    </g>
    <rect
      x="60"
      y="272"
      width="205"
      height="88"
      rx="10"
      fill="#fff"
      stroke="#cbd2da"
    />
    <rect
      x="350"
      y="272"
      width="208"
      height="88"
      rx="10"
      fill="#3e5066"
    />
    <rect
      x="695"
      y="196"
      width="245"
      height="88"
      rx="10"
      fill="#fff"
      stroke="#cbd2da"
    />
    <rect
      x="695"
      y="348"
      width="245"
      height="88"
      rx="10"
      fill="#fff"
      stroke="#cbd2da"
